dataset_path: coastalcph/LocalizedNarratives
dataset_kwargs:
  token: True
task: "localized_narratives_test"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.ln_doc_to_visual
doc_to_text: !function utils.ln_doc_to_text
doc_to_target: "caption"
generation_kwargs:
  max_new_tokens: 64
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.ln_process_result
# Note that the metric name can be either a registered metric function or a key
# name returned by process_results.
metric_list:
  - metric: coco_Bleu_4
    aggregation : !function utils.coco_bleu4
    higher_is_better : true
  - metric: coco_Bleu_3
    aggregation : !function utils.coco_bleu3
    higher_is_better : true
  - metric: coco_Bleu_2
    aggregation : !function utils.coco_bleu2
    higher_is_better : true
  - metric: coco_Bleu_1
    aggregation : !function utils.coco_bleu1
    higher_is_better : true
  - metric: coco_METEOR
    aggregation : !function utils.coco_meteor
    higher_is_better : true
  - metric: coco_ROUGE_L
    aggregation : !function utils.coco_rougel
    higher_is_better : true
  - metric: coco_CIDEr
    aggregation : !function utils.coco_cider
    higher_is_better : true
metadata:
  - version: 0.0
