dataset_path: Icey444/ShareGPT4V-COCO-eval
dataset_kwargs:
  token: True
task: "sharegpt4v_coco_eval"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.sharegpt4v_doc_to_visual
doc_to_text: !function utils.sharegpt4v_doc_to_text
doc_to_target: "caption"
generation_kwargs:
  max_new_tokens: 512
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.sharegpt4v_process_result
# Note that the metric name can be either a registered metric function (such as the case for GQA) or a key name returned by process_results
metric_list:
  - metric: sharegpt4v_Bleu_4
    aggregation : !function utils.sharegpt4v_bleu4
    higher_is_better : true
  - metric: sharegpt4v_Bleu_3
    aggregation : !function utils.sharegpt4v_bleu3
    higher_is_better : true
  - metric: sharegpt4v_Bleu_2
    aggregation : !function utils.sharegpt4v_bleu2
    higher_is_better : true
  - metric: sharegpt4v_Bleu_1
    aggregation : !function utils.sharegpt4v_bleu1
    higher_is_better : true
  - metric: sharegpt4v_METEOR
    aggregation : !function utils.sharegpt4v_meteor
    higher_is_better : true
  - metric: sharegpt4v_ROUGE_L
    aggregation : !function utils.sharegpt4v_rougel
    higher_is_better : true
  - metric: sharegpt4v_CIDEr
    aggregation : !function utils.sharegpt4v_cider
    higher_is_better : true
lmms_eval_specific_kwargs:
  # Default = Share-Captioner training prompt from the ShareGPT4V paper.
  # Override with --task_args 'lmms_eval_specific_kwargs.default.prompt=…'
  # if you want to reproduce a different captioner setup.
  default:
    prompt: "Analyze the image in a comprehensive and detailed manner."
metadata:
  - version: 0.0
